dbt_airbyte_poc:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST_DOCKER', 'postgres') }}"
      port: 5432
      user: "{{ env_var('DBT_USER', 'dbt_user') }}"
      password: "{{ env_var('DBT_PASSWORD', 'dbt_password') }}"
      dbname: airbyte_raw         # Connect to source database (cross-db queries not supported)
      schema: public              # Default schema (models override with staging/marts/gold)
      threads: 2                 # Conservative for Docker resource constraints; increase if host allows
    ci:
      type: postgres
      host: localhost
      port: 5432
      user: ci_user
      password: ci_password
      dbname: ci_test
      schema: public
      threads: 2

elementary:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST_DOCKER', 'postgres') }}"
      port: 5432
      user: "{{ env_var('DBT_USER', 'dbt_user') }}"
      password: "{{ env_var('DBT_PASSWORD', 'dbt_password') }}"
      dbname: airbyte_raw
      schema: elementary
      threads: 2
