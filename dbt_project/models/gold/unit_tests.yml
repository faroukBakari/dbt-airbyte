unit_tests:
  - name: test_return_rate_calculation
    description: >
      Verify return_rate_pct = total_returns / total_purchases * 100,
      rounded to 1 decimal place.
    model: gold_user_purchases.v1
    given:
      - input: ref('dim_users')
        rows:
          - {user_id: 1, full_name: "Test User", email: "test@test.com",
             occupation: "Engineer", city: "Portland", state: "OR",
             country_code: "US", age: 30, created_at: "2024-01-01",
             total_purchases: 10, total_spent: 500.00, total_returns: 3,
             first_purchase_at: "2024-01-15", last_purchase_at: "2024-06-01"}
      - input: ref('fct_purchases')
        rows:
          - {purchase_id: 1, user_id: 1, product_id: 1,
             product_make: "TestMake", product_model: "TestModel",
             product_price: 50.00, purchased_at: "2024-06-01",
             returned_at: null, is_returned: false}
    expect:
      rows:
        - {user_id: 1, return_rate_pct: 30.0}

  - name: test_avg_purchase_value
    description: >
      Verify avg_purchase_value = total_spent / total_purchases,
      rounded to 2 decimal places.
    model: gold_user_purchases.v1
    given:
      - input: ref('dim_users')
        rows:
          - {user_id: 1, full_name: "Test User", email: "test@test.com",
             occupation: "Engineer", city: "Portland", state: "OR",
             country_code: "US", age: 30, created_at: "2024-01-01",
             total_purchases: 3, total_spent: 250.00, total_returns: 0,
             first_purchase_at: "2024-01-15", last_purchase_at: "2024-06-01"}
      - input: ref('fct_purchases')
        rows:
          - {purchase_id: 1, user_id: 1, product_id: 1,
             product_make: "TestMake", product_model: "TestModel",
             product_price: 83.33, purchased_at: "2024-06-01",
             returned_at: null, is_returned: false}
    expect:
      rows:
        - {user_id: 1, avg_purchase_value: 83.33}

  - name: test_user_with_no_returns
    description: >
      Verify return_rate_pct = 0 when user has zero returns.
    model: gold_user_purchases.v1
    given:
      - input: ref('dim_users')
        rows:
          - {user_id: 1, full_name: "No Returns User", email: "noreturn@test.com",
             occupation: "Teacher", city: "Austin", state: "TX",
             country_code: "US", age: 25, created_at: "2024-01-01",
             total_purchases: 5, total_spent: 200.00, total_returns: 0,
             first_purchase_at: "2024-02-01", last_purchase_at: "2024-05-01"}
      - input: ref('fct_purchases')
        rows:
          - {purchase_id: 1, user_id: 1, product_id: 1,
             product_make: "TestMake", product_model: "TestModel",
             product_price: 40.00, purchased_at: "2024-05-01",
             returned_at: null, is_returned: false}
    expect:
      rows:
        - {user_id: 1, return_rate_pct: 0.0}

  - name: test_last_purchased_product
    description: >
      Verify last_purchased_product picks the most recent purchase
      and formats as "make model".
    model: gold_user_purchases.v1
    given:
      - input: ref('dim_users')
        rows:
          - {user_id: 1, full_name: "Test User", email: "test@test.com",
             occupation: "Engineer", city: "Portland", state: "OR",
             country_code: "US", age: 30, created_at: "2024-01-01",
             total_purchases: 2, total_spent: 300.00, total_returns: 0,
             first_purchase_at: "2024-01-15", last_purchase_at: "2024-06-01"}
      - input: ref('fct_purchases')
        rows:
          - {purchase_id: 1, user_id: 1, product_id: 1,
             product_make: "OldMake", product_model: "OldModel",
             product_price: 100.00, purchased_at: "2024-01-15",
             returned_at: null, is_returned: false}
          - {purchase_id: 2, user_id: 1, product_id: 2,
             product_make: "NewMake", product_model: "NewModel",
             product_price: 200.00, purchased_at: "2024-06-01",
             returned_at: null, is_returned: false}
    expect:
      rows:
        - {user_id: 1, last_purchased_product: "NewMake NewModel",
           last_purchased_price: 200.00}
