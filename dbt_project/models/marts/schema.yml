version: 2

models:
  - name: dim_users
    description: User dimension with purchase activity summary
    config:
      contract:
        enforced: true
    latest_version: 1
    columns:
      - name: user_id
        description: Primary key — unique user identifier
        data_type: bigint
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: full_name
        description: "User's display name"
        data_type: text
        data_tests:
          - not_null
      - name: email
        description: "User's email address"
        data_type: text
        data_tests:
          - unique
          - not_null
      - name: occupation
        description: "User's occupation"
        data_type: text
      - name: city
        description: "User's city of residence"
        data_type: text
      - name: state
        description: "User's state/region of residence"
        data_type: text
      - name: country_code
        description: Two-letter country code
        data_type: text
      - name: age
        description: "User's age in years"
        data_type: integer
      - name: created_at
        description: Account creation timestamp from source
        data_type: timestamptz
      - name: total_purchases
        description: Count of all purchase transactions
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: total_spent
        description: Sum of all purchase amounts (USD)
        data_type: numeric(12,2)
        data_tests:
          - not_null
      - name: total_returns
        description: Count of returned purchases
        data_type: bigint
      - name: first_purchase_at
        description: Timestamp of earliest purchase
        data_type: timestamptz
      - name: last_purchase_at
        description: Timestamp of most recent purchase
        data_type: timestamptz
    versions:
      - v: 1
        defined_in: dim_users

  - name: dim_products
    description: Product dimension with sales metrics
    config:
      contract:
        enforced: true
    latest_version: 1
    columns:
      - name: product_id
        description: Primary key — unique product identifier
        data_type: bigint
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: make
        description: Product manufacturer/brand
        data_type: text
        data_tests:
          - not_null
      - name: model
        description: Product model name
        data_type: text
        data_tests:
          - not_null
      - name: year
        description: Product model year
        data_type: integer
      - name: price
        description: Product unit price (USD)
        data_type: numeric(12,2)
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: created_at
        description: Product creation timestamp from source
        data_type: timestamptz
      - name: loaded_at
        description: Timestamp when record was loaded from source
        data_type: timestamptz
      - name: times_sold
        description: Total number of times this product was sold
        data_type: bigint
        data_tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: times_returned
        description: Total number of times this product was returned
        data_type: bigint
    versions:
      - v: 1
        defined_in: dim_products

  - name: fct_purchases
    description: Individual purchase transactions enriched with product data
    config:
      contract:
        enforced: true
    latest_version: 1
    columns:
      - name: purchase_id
        description: Primary key — unique transaction identifier
        data_type: bigint
        data_tests:
          - unique
          - not_null
      - name: user_id
        description: FK to stg_users
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_users')
              field: user_id
      - name: product_id
        description: FK to stg_products
        data_type: bigint
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: product_make
        description: Product manufacturer/brand (from stg_products)
        data_type: text
      - name: product_model
        description: Product model name (from stg_products)
        data_type: text
      - name: product_price
        description: Product unit price in USD (from stg_products)
        data_type: numeric(10,2)
      - name: purchased_at
        description: Timestamp of purchase (may be null in source data)
        data_type: timestamptz
      - name: added_to_cart_at
        description: Timestamp when item was added to cart
        data_type: timestamptz
      - name: returned_at
        description: Timestamp of return (null if not returned)
        data_type: timestamptz
      - name: is_returned
        description: Whether this purchase was returned
        data_type: boolean
      - name: loaded_at
        description: Timestamp when record was loaded from source
        data_type: timestamptz
    versions:
      - v: 1
        defined_in: fct_purchases
