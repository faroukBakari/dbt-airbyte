name: 'dbt_airbyte_poc'
version: '1.0.0'
config-version: 2

profile: 'dbt_airbyte_poc'

model-paths: ["models"]       # sources → staging → marts → gold layer hierarchy
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]          # Deterministic test data (used in seed mode, see README)
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:                 # Removed by `dbt clean` — safe to regenerate
  - "target"
  - "dbt_packages"

models:
  dbt_airbyte_poc:
    staging:
      +materialized: view      # Views: lightweight, always reflect latest raw data
      +schema: staging
    marts:
      +materialized: table     # Tables: pre-computed for join performance
      +schema: marts
      +contract: {enforced: true}
    gold:
      +materialized: table     # Tables: analytics-ready, consumed by Metabase
      +schema: gold
      +contract: {enforced: true}
  elementary:
    +schema: elementary          # Elementary observability tables — persistent test/run metadata
