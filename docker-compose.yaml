services:
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    container_name: dbt-runner
    working_dir: /usr/app/dbt
    # .env = user config (POSTGRES_*, DOCKER_NETWORK)
    # .env.generated = auto-created by setup.sh (credentials, derived vars)
    env_file:
      - .env
      - .env.generated
    volumes:
      - ./dbt_project:/usr/app/dbt
      - ./profiles:/root/.dbt
    ports:
      - "52419:52419"  # dbt docs serve
    networks:
      - poc-network
    entrypoint: ["tail", "-f", "/dev/null"]  # Keep alive for interactive use

  airflow:
    image: apache/airflow:2.8.1-python3.11
    container_name: airflow
    command: standalone
    env_file:
      - .env
      - .env.generated
    environment:
      - AIRFLOW__WEBSERVER__SECRET_KEY=poc-demo-secret-key-not-for-production
      - DOCKER_API_VERSION=1.44
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_ADMIN_USER:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - poc-network
    user: "${AIRFLOW_UID:-50000}:${DOCKER_GID:-1001}"

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    environment:
      # Use PostgreSQL for Metabase app state (not the default H2)
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-postgres}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-password}
      MB_DB_HOST: ${POSTGRES_CONTAINER:-postgres}
    ports:
      - "54892:3000"
    networks:
      - poc-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s         # Metabase is slow to boot (JVM + migrations); avoid false-negative healthchecks

networks:
  poc-network:
    name: ${DOCKER_NETWORK:-poc-network}
    external: true
